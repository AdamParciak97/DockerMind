services:
  dockermind-web:
    image: dockermind-web:1.3
    container_name: dockermind-web
    restart: unless-stopped
    environment:
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      AI_API_TOKEN: ${AI_API_TOKEN}
      CT_USERNAME: ${CT_USERNAME}
      CT_PASSWORD: ${CT_PASSWORD}
      CT_SECRET_KEY: ${CT_SECRET_KEY}
      AGENT_SECRET_TOKEN: ${AGENT_SECRET_TOKEN}
      CT_PORT: 8080
    volumes:
      - dockermind_data:/app/data
      - ./certs:/app/certs:ro
    expose:
      - "8080"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  nginx:
    image: dockermind-nginx:1.3
    container_name: dockermind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - dockermind-web
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

volumes:
  dockermind_data: {}
