services:
  dockermind-agent:
    build: .
    image: dockermind-agent:1.3
    container_name: dockermind-agent
    restart: unless-stopped
    # Wymagane przez opcjonalny terminal hosta; faktyczne otwarcie terminala
    # nadal wymaga HOST_ACCESS_ENABLED=true w .env.
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/dockermind:/etc/dockermind:ro
      - ./certs:/etc/dockermind/certs:ro
      - /:/host
      - /proc/1/net:/host-proc-net:ro
    environment:
      - CENTRAL_URL=${CENTRAL_URL}
      - CENTRAL_CA_CERT=${CENTRAL_CA_CERT:-}
      - AGENT_TOKEN=${AGENT_TOKEN}
      - AGENT_NAME=${AGENT_NAME}
      - HOST_ROOT=/host
      - AGENT_IP=${AGENT_IP:-}
      - HOST_ACCESS_ENABLED=${HOST_ACCESS_ENABLED:-false}
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SYS_ADMIN
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    pids_limit: 100
